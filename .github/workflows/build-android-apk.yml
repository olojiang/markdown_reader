name: Build Android APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Sync Android project
        run: npm run android:sync

      - name: Build signed release APK
        run: |
          VERSION_NAME=$(node -e "console.log(require('./package.json').version)")
          VERSION_CODE="${{ github.run_number }}"
          cd android && ./gradlew assembleRelease \
            -PAPP_VERSION_NAME="$VERSION_NAME" \
            -PAPP_VERSION_CODE="$VERSION_CODE"

      - name: Rename APK artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/markdown-reader-${{ github.run_number }}-android-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: markdown-reader-android-release-apk
          path: android/app/build/outputs/apk/release/markdown-reader-${{ github.run_number }}-android-release.apk
          if-no-files-found: error
