name: Build iOS IPA

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync iOS project
        run: npm run ios:sync

      - name: Build unsigned iOS app
        run: |
          VERSION_NAME=$(node -e "console.log(require('./package.json').version)")
          VERSION_CODE="${{ github.run_number }}"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ios/DerivedData \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$VERSION_CODE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find ios/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          mkdir -p ios/output/Payload
          cp -R "$APP_PATH" ios/output/Payload/
          cd ios/output
          zip -qry "markdown-reader-ios-unsigned-${{ github.run_number }}.ipa" Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: markdown-reader-ios-unsigned-ipa
          path: ios/output/markdown-reader-ios-unsigned-${{ github.run_number }}.ipa
          if-no-files-found: error
