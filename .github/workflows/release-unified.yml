name: Release Unified Assets

on:
  release:
    types:
      - published

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  desktop:
    name: Release ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            dist_script: dist:win
            release_glob: release/*.exe
          - name: macOS x64
            os: macos-latest
            dist_script: dist:mac
            release_glob: release/*.dmg
          - name: Linux x64
            os: ubuntu-latest
            dist_script: dist:linux
            release_glob: release/*.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run ${{ matrix.dist_script }}

      - name: Upload desktop asset to release
        run: gh release upload "${{ github.event.release.tag_name }}" ${{ matrix.release_glob }} --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Release Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Sync Android project
        run: npm run android:sync

      - name: Build signed release APK
        run: |
          VERSION_NAME="${{ github.event.release.tag_name }}"
          VERSION_NAME="${VERSION_NAME#v}"
          VERSION_CODE="${{ github.run_number }}"
          cd android && ./gradlew assembleRelease \
            -PAPP_VERSION_NAME="$VERSION_NAME" \
            -PAPP_VERSION_CODE="$VERSION_CODE"

      - name: Rename APK for release
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/markdown-reader-${{ github.event.release.tag_name }}-android-release.apk

      - name: Upload Android APK to release
        run: gh release upload "${{ github.event.release.tag_name }}" "android/app/build/outputs/apk/release/markdown-reader-${{ github.event.release.tag_name }}-android-release.apk" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
