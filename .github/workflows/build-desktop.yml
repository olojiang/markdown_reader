name: Build Desktop Releases

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Build target platform
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos

jobs:
  build:
    name: ${{ matrix.name }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
      ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: windows
            dist_script: dist:win
            artifact_name: markdown-reader-windows-x64
          - name: macOS x64
            os: macos-latest
            target: macos
            dist_script: dist:mac
            artifact_name: markdown-reader-macos-x64
          - name: Linux x64
            os: ubuntu-latest
            target: linux
            dist_script: dist:linux
            artifact_name: markdown-reader-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Electron caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run ${{ matrix.dist_script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.yml
            release/latest*.yml
          if-no-files-found: error
