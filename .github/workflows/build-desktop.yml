name: Build Desktop Releases

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Build target platform
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: windows
            dist_script: dist:win
            artifact_name: markdown-reader-windows-x64
          - name: macOS x64
            os: macos-latest
            target: macos
            dist_script: dist:mac
            artifact_name: markdown-reader-macos-x64
          - name: Linux x64
            os: ubuntu-latest
            target: linux
            dist_script: dist:linux
            artifact_name: markdown-reader-linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.target }}
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.target }}
        run: npm ci

      - name: Build and package
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.target }}
        run: npm run ${{ matrix.dist_script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.target }}
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.yml
            release/latest*.yml
          if-no-files-found: error
